    <title>Instron Lab — обработка испытаний на растяжение</title>

  <body>
    <div id="root"></div>
    <script>
      // Heartbeat для exe-лаунчера: без пингов встроенный сервер завершается.
      // На file:// запросы молча падают — игнорируем.
      setInterval(function () {
        fetch('/api/heartbeat', { method: 'POST', cache: 'no-store' }).catch(function () {});
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
